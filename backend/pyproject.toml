[project]
name = "envmgr-backend"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    # Explicit floor, not just whatever fastapi allows (>=0.46.0): every
    # starlette 0.x is affected by CVE-2026-48710/48817/48818/54282/54283.
    "starlette>=1.3.1",
    "uvicorn[standard]==0.52.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.29.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    # PyJWT rather than python-jose: python-jose is near-dormant and drags in
    # ecdsa, whose CVE-2024-33663 sibling CVE-2024-23342 upstream declined to fix.
    "pyjwt==2.13.0",
    # bcrypt directly rather than passlib, which last shipped in 2020 and could
    # not work with bcrypt>=4 — the reason for the old `bcrypt<4` pin.
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "redis==5.0.1",
    "pandas==2.1.4",
    "openpyxl==3.1.2",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "email-validator>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "python-dateutil>=2.8",
    "nats-py>=2.3",
    "prometheus-client>=0.26",
    # Fernet for symmetric encryption of stored third-party credentials.
    # Deliberately NOT reusing SECRET_KEY (JWT signing) — different blast
    # radius, different rotation schedule.
    "cryptography==50.0.0",
    # Parses Terraform .tf source. The existing terraform_import_service reads
    # .tfstate, which is normally not committed — a repository scanner needs
    # the source form.
    "python-hcl2==7.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
