name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest

    # The suite runs against BOTH engines.
    #
    # sqlite is what it has always used: fast, in-memory, no server. But several
    # migrations and constraints are dialect-gated — the partial unique indexes
    # behind `if dialect.name != "postgresql": return` are inert under SQLite —
    # so a SQLite-only run cannot exercise them and never touches the engine
    # production actually uses.
    #
    # A PostgreSQL server is also required by tests/test_migration_schema_drift.py,
    # which builds a throwaway database with `alembic upgrade head` and diffs the
    # result against Base.metadata. That test skips without one, which is how six
    # tables shipped missing their created_at/updated_at columns.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: envmgr
          POSTGRES_PASSWORD: envmgr_dev_password
          POSTGRES_DB: envmgr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Settings refuses to construct outside DEBUG while holding the repo's
      # placeholder key — see app/core/config.py.
      SECRET_KEY: ci-secret-key-not-for-deployment
      MIGRATION_TEST_ADMIN_URL: postgresql+psycopg2://envmgr:envmgr_dev_password@localhost:5432/postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create the PostgreSQL test database
        if: matrix.db == 'postgres'
        run: |
          PGPASSWORD=envmgr_dev_password psql -h localhost -U envmgr -d postgres \
            -c 'CREATE DATABASE envmgr_test'

      - name: Assert the migration drift guard is actually running
        # The guard skips when no PostgreSQL is reachable. A silent skip here
        # would defeat the point of this job, so fail loudly instead.
        # Runs on one leg only — it is about the migration chain, not the engine
        # the suite happens to be pointed at.
        if: matrix.db == 'postgres'
        run: |
          uv run pytest tests/test_migration_schema_drift.py -q --no-header -rs \
            | tee /tmp/drift.txt
          if grep -q "SKIPPED" /tmp/drift.txt; then
            echo "::error::migration drift guard skipped — PostgreSQL was not reachable"
            exit 1
          fi

      - name: Assert the environment tier migration guard is actually running
        # Same failure mode as the drift guard above, for the tier
        # upgrade/downgrade coverage in test_environment_tier_migration.py — a
        # silent skip here would mean the downgrade truncation bug (found once
        # by code review) has no test actually running against it.
        if: matrix.db == 'postgres'
        run: |
          uv run pytest tests/test_environment_tier_migration.py -q --no-header -rs \
            | tee /tmp/tier_migration.txt
          if grep -q "SKIPPED" /tmp/tier_migration.txt; then
            echo "::error::environment tier migration guard skipped — PostgreSQL was not reachable"
            exit 1
          fi

      - name: Run test suite (SQLite)
        if: matrix.db == 'sqlite'
        run: uv run pytest -q

      - name: Run test suite (PostgreSQL)
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://envmgr:envmgr_dev_password@localhost:5432/envmgr_test
        run: uv run pytest -q

      - name: Dependency advisories
        # Fails on any advisory not explicitly accepted with a reachability
        # argument in the script. See docs/dependency-audit.md.
        if: matrix.db == 'sqlite'
        run: uv run python scripts/audit_dependencies.py

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 to match the development toolchain: package-lock.json was
          # generated by the npm 11 that ships with Node 24, and npm 10
          # (Node 22) rejects it as out of sync with package.json.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency advisories
        run: npm run audit

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: envmgr-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: envmgr-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Compose files are valid and ports do not double-bind
        # `docker compose` APPENDS sequences across override files, so a missing
        # !override on a ports list silently republishes the base port too.
        env:
          SECRET_KEY: ci-secret-key-not-for-deployment
          POSTGRES_PASSWORD: ci-password
        run: |
          docker compose -f docker-compose.yml --profile app config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --profile app config > /tmp/prod-config.yml
          python3 - <<'PY'
          import sys, yaml
          services = yaml.safe_load(open('/tmp/prod-config.yml'))['services']
          failures = []
          for name, svc in services.items():
              if (svc.get('deploy') or {}).get('replicas') == 0:
                  continue
              published = [p.get('published') for p in svc.get('ports') or []]
              if len(published) != len(set(published)):
                  failures.append(f"{name}: duplicate published ports {published}")
              targets = [p.get('target') for p in svc.get('ports') or []]
              if len(targets) != len(set(targets)):
                  failures.append(f"{name}: container port published twice {published} -> {targets}")
          if failures:
              print("\n".join(f"::error::{f}" for f in failures))
              sys.exit(1)
          print("compose port mappings OK")
          PY
