version: '3.8'

services:
  # PostgreSQL - Primary database
  postgres:
    image: postgres:15-alpine
    container_name: envmgr-postgres
    environment:
      POSTGRES_DB: envmgr
      POSTGRES_USER: envmgr
      POSTGRES_PASSWORD: envmgr_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envmgr"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache and session storage
  redis:
    image: redis:7-alpine
    container_name: envmgr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NATS - Message broker with JetStream persistence
  nats:
    image: nats:latest
    container_name: envmgr-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jira - Issue tracking (dev only, disabled in prod)
  jira:
    image: atlassian/jira-software:latest
    container_name: envmgr-jira
    ports:
      - "8090:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://jira-db:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira_dev_password
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: 512m
      JVM_MAXIMUM_MEMORY: 2048m
    volumes:
      - jira-data:/var/atlassian/application-data/jira
    depends_on:
      - jira-db

  # Jira's dedicated PostgreSQL instance
  jira-db:
    image: postgres:15
    container_name: envmgr-jira-db
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira_dev_password
      POSTGRES_ENCODING: UNICODE
      POSTGRES_COLLATE: C
      POSTGRES_COLLATE_TYPE: C
    volumes:
      - jira-db-data:/var/lib/postgresql/data

  # GitLab CE - CI/CD testing (dev only, disabled in prod)
  # First run: visit http://localhost:8929, sign in as root with password from:
  #   docker exec -it envmgr-gitlab grep 'Password:' /etc/gitlab/initial_root_password
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: envmgr-gitlab
    hostname: localhost
    ports:
      - "8929:8929"
      - "2224:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        # Reduce memory footprint for local dev
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m

  # GitLab Runner - executes CI/CD jobs
  # After GitLab is up, register with:
  #   docker exec -it envmgr-gitlab-runner gitlab-runner register --url http://gitlab:8929 --executor docker --docker-image alpine:latest
  #   URL: http://gitlab:8929  (internal network — matches external_url port)
  #   Token: from GitLab > Admin > Runners
  #   Executor: docker  |  Default image: alpine:latest
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: envmgr-gitlab-runner
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gitlab

  # ── Application ────────────────────────────────────────────────────────
  # Under the "app" profile so the documented dev flow (`docker-compose up -d`
  # for infrastructure, then uvicorn + vite on the host) does not fight these
  # containers for ports 8000/5173. Start them with:
  #   docker compose --profile app up -d
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    image: envmgr-backend:local
    container_name: envmgr-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://envmgr:${POSTGRES_PASSWORD:-envmgr_dev_password}@postgres:5432/envmgr
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      # DEBUG=true permits the repo's placeholder SECRET_KEY. Any deployment
      # with DEBUG=false must supply a real one or the app refuses to start.
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    image: envmgr-frontend:local
    container_name: envmgr-frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  nats-data:
  jira-data:
  jira-db-data:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  gitlab-runner-config:

networks:
  default:
    name: envmgr-network
