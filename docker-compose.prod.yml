# Production override for macmini deployment (Tailscale network)
#
# Usage:
#   SECRET_KEY=... POSTGRES_PASSWORD=... \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       --profile app up -d --build
#
# Note the `!override` tags on every ports list: compose APPENDS sequences
# across override files, so a plain `ports:` here would keep the base mapping
# alongside the remapped one and re-create the very port conflicts this file
# exists to avoid.
#
# This override:
#   - Removes nats (shared from macmini)
#   - Remaps postgres to port 5435 (avoids conflict with Supabase:5432, Langfuse:5433)
#   - Remaps backend to port 8100 (avoids conflict with Supabase Kong:8000)
#   - Points NATS at the macmini shared service

services:
  # Disable services already provided by macmini
  nats:
    deploy:
      replicas: 0

  # Disable dev-only services
  jira:
    deploy:
      replicas: 0

  jira-db:
    deploy:
      replicas: 0

  gitlab:
    deploy:
      replicas: 0

  gitlab-runner:
    deploy:
      replicas: 0

  # Remap postgres to prod port
  postgres:
    ports: !override
      - "5435:5432"

  # Backend with prod environment variables
  backend:
    environment:
      # +asyncpg is required — the app builds an async engine and rejects a
      # bare postgresql:// URL at startup.
      DATABASE_URL: postgresql+asyncpg://envmgr:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/envmgr
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://macmini:4222
      # Required: the app refuses to start with DEBUG=false and the repo's
      # placeholder key. Generate with `openssl rand -hex 32`.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set for production}
      DEBUG: "false"
    ports: !override
      - "8100:8000"

  # Frontend served by nginx; proxies /api to the backend container.
  frontend:
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports: !override
      - "5173:8080"
