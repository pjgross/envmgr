# Production override for macmini deployment (Tailscale network)
#
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This override:
#   - Removes neo4j and nats (shared from macmini)
#   - Remaps postgres to port 5435 (avoids conflict with Supabase:5432, Langfuse:5433)
#   - Remaps backend to port 8100 (avoids conflict with Supabase Kong:8000)
#   - Points NATS and Neo4j to macmini shared services

services:
  # Disable services already provided by macmini
  neo4j:
    deploy:
      replicas: 0

  nats:
    deploy:
      replicas: 0

  # Disable dev-only services
  jira:
    deploy:
      replicas: 0

  jira-db:
    deploy:
      replicas: 0

  gitlab:
    deploy:
      replicas: 0

  gitlab-runner:
    deploy:
      replicas: 0

  # Remap postgres to prod port
  postgres:
    ports:
      - "5435:5432"

  # Backend with prod environment variables
  backend:
    environment:
      DATABASE_URL: postgresql://envmgr:${POSTGRES_PASSWORD}@postgres:5432/envmgr
      NEO4J_URI: bolt://macmini:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://macmini:4222
      # Required: the app refuses to start with DEBUG=false and the repo's
      # placeholder key. Generate with `openssl rand -hex 32`.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set for production}
      DEBUG: "false"
    ports:
      - "8100:8000"
