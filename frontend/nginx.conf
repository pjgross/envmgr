server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # src/services/api.ts uses a relative baseURL ('/api/v1'), so whatever serves
    # the bundle must also proxy the API. BACKEND_ORIGIN is substituted from the
    # environment at container start (see the Dockerfile's templates/ copy).
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};
        proxy_http_version 1.1;
        # $http_host, not $host: $host omits the port, so FastAPI's trailing-slash
        # redirects (e.g. GET /api/v1/environments -> .../environments/) would come
        # back pointing at port 80 and the browser would follow them off-site.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets are immutable; index.html must not be cached or clients pin
    # to a stale bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — react-router owns client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
